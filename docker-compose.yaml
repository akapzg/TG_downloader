services:
  telegram_media_downloader:
    build: .
    image: ghcr.io/${{ github.repository }}:latest
    container_name: tg_downloader
    ports:
      # Web UI port (edit if you changed web_port in config.yaml)
      - "5000:5000"
    # Proxy support (uncomment and set if needed):
    # environment:
    #   http_proxy: "http://proxy.example.com:1080"
    #   https_proxy: "http://proxy.example.com:1080"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # ── Configuration (bind-mount for easy editing) ──────────
      - ./config.yaml:/app/config.yaml:ro
      - ./data.yaml:/app/data.yaml

      # ── Persistent runtime data ─────────────────────────────
      - tg_sessions:/app/sessions
      - tg_logs:/app/log
      - tg_temp:/app/temp

      # ── Downloaded media ────────────────────────────────────
      - tg_downloads:/app/downloads

      # ── Rclone config (optional cloud upload) ───────────────
      - ${HOME}/.config/rclone:${HOME}/.config/rclone:ro

    restart: unless-stopped

volumes:
  tg_sessions:
  tg_logs:
  tg_temp:
  tg_downloads:
