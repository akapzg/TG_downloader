services:
  telegram_media_downloader:
    image: ghcr.io/akapzg/tg_downloader:latest
    container_name: tg_downloader
    ports:
      # Web UI port (edit if you changed web_port in config.yaml)
      - "5000:5000"
    # Proxy support (uncomment and set if needed):
    # environment:
    #   http_proxy: "http://proxy.example.com:1080"
    #   https_proxy: "http://proxy.example.com:1080"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./data.yaml:/app/data.yaml
      - ./sessions:/app/sessions
      - ./log:/app/log
      - ./temp:/app/temp
      - ./downloads:/app/downloads
      - ${HOME}/.config/rclone:${HOME}/.config/rclone:ro

    restart: unless-stopped
